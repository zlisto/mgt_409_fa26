  <link rel="stylesheet" href="css/style.css">
  <script>!(function(){if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>
  <nav class="site-nav">
    <ul class="navbar">
      <li><a href="index.html">Home</a></li>
      <li><a href="instructions.html">Instructions</a></li>

  <main>
    <h1 class="schedule-header">Homework Assignments</h1>
   
    <p class="schedule-note">
      <a href="hw1/p1.html">HW1</a> ·
      HW2 · HW3 · HW4 · HW5 · HW6
    </p>

    <div class="accordion-container">

      <div class="accordion">
        <button class="accordion-btn">Homework 1</button>
        <div class="panel">

      <div class="accordion">

  <script>
    const acc = document.querySelectorAll(".accordion-btn");
    acc.forEach(btn => {
      btn.addEventListener("click", function () {
        this.classList.toggle("active");
        const panel = this.nextElementSibling;
        panel.style.display = panel.style.display === "block" ? "none" : "block";
      });
    });
  </script>

  <script src="js/theme.js"></script>

  <footer class="site-footer">
