<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="News card: MCP 2026-07-28 specification is stateless">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#286dc0"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="22" fill="#071422"/>
  <rect x="0" y="0" width="14" height="420" fill="url(#s1)"/>
  <rect x="28" y="24" width="864" height="372" rx="16" fill="#0c1f33" stroke="#38bdf8" stroke-width="2"/>
  <text x="52" y="64" fill="#7dd3fc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">MCP BLOG    28 JUL 2026</text>
  <text x="52" y="118" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">Spec 2026-07-28: no handshake,</text>
  <text x="52" y="158" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">no session ID. Request/response.</text>
  <text x="52" y="218" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="20">Any request can hit any server instance. That is how you put</text>
  <text x="52" y="248" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="20">tools behind a normal load balancer, like the rest of the web.</text>
  <rect x="52" y="286" width="780" height="78" rx="12" fill="#12324a"/>
  <text x="72" y="322" fill="#5eead4" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Manager takeaway</text>
  <text x="72" y="348" fill="#ecfeff" font-family="Inter, Arial, sans-serif" font-size="17">MCP stopped being a sticky chat socket. It can scale like HTTP.</text>
</svg>
