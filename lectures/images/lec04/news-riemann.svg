<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="News card: Anthropic, 10 August 2026, Claude improved a Riemann zeta bound">
  <defs>
    <linearGradient id="ri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#286dc0"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="22" fill="#0b1220"/>
  <rect x="0" y="0" width="14" height="420" fill="url(#ri)"/>
  <rect x="28" y="24" width="864" height="372" rx="16" fill="#101820" stroke="#7c5cff" stroke-width="2"/>
  <text x="52" y="64" fill="#b8a6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">ANTHROPIC RESEARCH � 10 AUG 2026</text>
  <text x="52" y="118" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Claude did not prove the Riemann</text>
  <text x="52" y="154" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">hypothesis. It moved a related bound.</text>
  <text x="52" y="210" fill="#c9d6e8" font-family="Inter, Arial, sans-serif" font-size="20">Share of zeta zeros proven to lie on the critical line:</text>
  <text x="52" y="242" fill="#c9d6e8" font-family="Inter, Arial, sans-serif" font-size="20">41.6% � 67.2%. Recombined existing number-theory results.</text>
  <rect x="52" y="286" width="800" height="78" rx="12" fill="#1c2740"/>
  <text x="72" y="322" fill="#ffd166" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">The agent story</text>
  <text x="72" y="348" fill="#e8eef4" font-family="Inter, Arial, sans-serif" font-size="17">~650 failed approaches, then ~60 subagents that critique and prune.</text>
</svg>
